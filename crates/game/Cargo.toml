[package]
name = "game"
description = "The game binary: loads the base mod into the engine and opens the client."
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "boxel"
path = "src/main.rs"

[dependencies]
api.workspace = true
sim.workspace = true
server.workspace = true
client.workspace = true
base.workspace = true
base_movement.workspace = true
base_cow.workspace = true
wasm_host.workspace = true
data_mods.workspace = true

[features]
# Records how long every system takes to a Chrome trace (open it in ui.perfetto.dev), for
# chasing hitches: `TRACE_CHROME=<file>.json cargo run --release --features trace`. Written when
# the game quits normally.
trace = ["client/trace"]

[build-dependencies]
wit-component.workspace = true

[dev-dependencies]
glam.workspace = true
