# Sounds, for blocks, targets and the player to name. See the data_mods crate's sounds module
# for every field. Files are Ogg Vorbis, or WAV for loops; where they came from is in CREDITS.md.
# printer.wav, wind.wav and powerdown.ogg are made by tools/make_sounds.sh.
#
# Each sound lists its variations (one picked at random each play). volume is a gain on the
# file, pitch the playback speed, pitch_spread how much each play wanders either way.
#
# Only sounds the game uses are kept here. More to try are in ~/Projects/boxel-sound-packs (see
# its README); the tuning panel's pick lists offer every sound in this file, and F5 reloads it.

# Footsteps, one per surface, tuned by ear in the tuning panel's Footsteps list (2026-11-05).
# Brick and the player's own fallback use step_concrete.
[sounds.step_on_stone]
files = ["sounds/footstep_concrete_*.ogg"]
volume = 0.125
pitch = 0.5
pitch_spread = 0.06

[sounds.step_on_marker]
files = ["sounds/footstep_concrete_*.ogg"]
volume = 0.075
pitch = 0.77
pitch_spread = 0.06

[sounds.step_on_wood]
files = ["sounds/footstep_wood_*.ogg"]
volume = 0.225
pitch = 1.55
pitch_spread = 0.06

[sounds.step_on_log]
files = ["sounds/footstep_wood_*.ogg"]
volume = 0.25
pitch = 1.0
pitch_spread = 0.06

[sounds.step_on_crafting_table]
files = ["sounds/footstep_wood_*.ogg"]
volume = 0.2
pitch = 1.15
pitch_spread = 0.06

[sounds.step_on_dirt]
files = ["sounds/step_lth*.ogg"]
volume = 0.24
pitch = 1.15
pitch_spread = 0.06

[sounds.step_on_grass]
files = ["sounds/step_lth*.ogg"]
volume = 0.24
pitch = 0.98
pitch_spread = 0.06

[sounds.step_on_gravel]
files = ["sounds/gravel_snow_*.ogg"]
volume = 0.12
pitch = 0.5
pitch_spread = 0.06

[sounds.step_on_ice]
files = ["sounds/gravel_ice_*.ogg"]
volume = 0.24
pitch = 1.98
pitch_spread = 0.06

[sounds.step_concrete]
files = ["sounds/footstep_concrete_*.ogg"]
volume = 0.5
pitch_spread = 0.06


