# The player, a robot. A landing is the surface's own footstep, louder (see the client's
# land_loudness); a hard one adds hardland_robot.
[sounds.hardland_robot]
files = ["sounds/impactPlate_heavy_*.ogg"]
volume = 1.6
pitch = 0.97
pitch_spread = 0.05

[sounds.hurt_robot]
files = ["sounds/impactPlate_heavy_*.ogg"]
volume = 3.2
pitch = 0.675
pitch_spread = 0.05

[sounds.knockout_robot]
files = ["sounds/powerdown.ogg"]
volume = 0.72
pitch = 0.5

[sounds.guard]
files = ["sounds/impactMetal_medium_*.ogg"]
volume = 0.8
pitch_spread = 0.05

[sounds.pickup_robot]
files = ["sounds/pickup_beads.ogg"]
volume = 0.1
pitch = 0.5
pitch_spread = 0.05

[sounds.craft]
files = ["sounds/scifi_impactMetal_*.ogg"]
volume = 0.6
pitch_spread = 0.05

[sounds.craft_refused]
files = ["sounds/scifi_forceField_000.ogg"]
volume = 0.4


# Loops the client drives. The servo (the neck's motor, a stepper like a 3D printer's) follows
# how fast the view turns; printer.wav is a real printer recording, TEMPORARY: replace before
# release (see CREDITS.md). The wind follows how fast the body moves.
[sounds.servo]
files = ["sounds/printer.wav"]
looping = true

[sounds.wind]
files = ["sounds/wind.wav"]
looping = true
