# Things to hit. See the data_mods crate's targets module for every field.
#
# Models are OBJ files, Z up, in meters, with the feet at the origin and the front facing +Y.
# Textures are PNGs, drawn with hard pixel edges. Sounds are Ogg Vorbis. Where they came from
# is in CREDITS.md.

[models.cow]
mesh = "models/cow.obj"
texture = "textures/cow.png"

[sounds.moo]
file = "sounds/moo.ogg"

# A training dummy shaped like a cow. Its collision box covers the middle of the body; strikes
# hit its hit boxes, which follow the model.
[[target]]
name = "cow"
model = "cow"
hit_sound = "moo"
width = 0.9
height = 1.3
health = 20
weight = 2.5
# Heavy and draggy, so a hit sends it off fast and it stops short instead of floating.
gravity = 40
drag = 9
air_drag = 3
bounce = 0.3
respawn_time = 3
slam_speed = 4
slam_damage = 2

# Body and neck, legs included.
[[target.hit_box]]
name = "body"
min = [-0.47, -0.83, 0.0]
max = [0.47, 1.1, 1.31]
damage = 1

[[target.hit_box]]
name = "head"
min = [-0.28, 1.1, 0.8]
max = [0.28, 1.84, 1.45]
damage = 2
