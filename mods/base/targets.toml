# Things to hit. See the data_mods crate's targets module for every field.
#
# Models are OBJ files, or glTF binaries with a skeleton and animations; Z up, in meters, with
# the feet at the origin and the front facing +Y. Textures are PNGs, drawn with hard pixel
# edges. Where they came from is in CREDITS.md. Sounds are in sounds.toml.

[models.cow]
mesh = "models/cow.glb"
texture = "textures/cow.png"
# The rest loop.
play_once = ["eat", "punch", "die"]

# A cow. It wanders, grazes, watches the player and runs off when hit; its brain is code, in
# the base crate's cow module. Its collision box covers the middle of the body; strikes hit its
# hit boxes, which follow the model.
[[target]]
name = "cow"
model = "cow"
sounds = { hit = "moo", step = "hoof", slam = "slam", death = "kill_cow" }
brain = "cow"
width = 0.9
height = 1.3
# Up slabs, not full blocks.
step_height = 0.6
health = 130
weight = 2.5
# Heavy and draggy, so a hit sends it off fast and it stops short instead of floating. Drag
# is also how quickly it gets up to walking speed.
gravity = 40
drag = 9
air_drag = 3
bounce = 0.3
respawn_time = 3
# Killed cows stay dead until the player is knocked out, which brings the whole herd back.
respawns = false
slam_speed = 4
slam_damage = 2
# Hops up a full block (about 1.25 m at this gravity) where its path needs it.
hop_speed = 10
# Its paths walk off two blocks at most, which lands below fall_speed.
max_drop = 2.2
# A fall of about 2.5 m starts to hurt; one off a 10 m cliff takes near half its health.
fall_speed = 14
fall_damage = 4

# Body and neck, legs included.
[[target.hit_box]]
name = "body"
min = [-0.47, -0.83, 0.0]
max = [0.47, 1.1, 1.31]
damage = 1

[[target.hit_box]]
name = "head"
min = [-0.28, 1.1, 0.8]
max = [0.28, 1.84, 1.45]
damage = 2
