[looks.copper]
sheen = { strength = 0.35, sharpness = 24 }
noise = { colors = [[170, 96, 58], [184, 108, 66], [196, 120, 76]], scale = 4, seed = 13 }

# Make-believe: a pale violet and its opposite, a sea green, both with a glassy sheen.
[looks.phasite]
sheen = { strength = 0.45, sharpness = 32 }
noise = { colors = [[150, 120, 196], [162, 132, 208], [174, 146, 218]], scale = 5, seed = 14 }

[looks.antiphasite]
sheen = { strength = 0.45, sharpness = 32 }
noise = { colors = [[96, 176, 150], [108, 188, 162], [120, 200, 174]], scale = 5, seed = 15 }

# Make-believe, for trying out what materials could do (2026-11-08): a lamp that lights itself,
# and two unstable crystals, a blue one and a green one, that blast when they touch.
[looks.lumite]
glow = 1.1
noise = { colors = [[246, 222, 150], [252, 232, 170], [255, 242, 196]], scale = 3, seed = 16 }

[looks.blue_crystal]
sheen = { strength = 0.6, sharpness = 48 }
glow = 0.35
noise = { colors = [[52, 96, 210], [70, 120, 232], [96, 150, 246]], scale = 2, seed = 17 }

[looks.green_crystal]
sheen = { strength = 0.6, sharpness = 48 }
glow = 0.35
noise = { colors = [[60, 190, 80], [84, 214, 100], [120, 236, 130]], scale = 2, seed = 18 }

# Make-believe (2026-11-11, names are placeholders): cachite keeps what touches it, a dark slate
# with pale flecks; mendite puts back what's gone around it, a glassy rose.
[looks.cachite]
sheen = { strength = 0.2, sharpness = 16 }
noise = { colors = [[58, 62, 74], [64, 68, 80], [70, 74, 86], [150, 156, 170]], scale = 1, seed = 20 }

[looks.mendite]
