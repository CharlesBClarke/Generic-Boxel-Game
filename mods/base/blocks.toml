# The base game's blocks. Each block gets the `base:` namespace from mod.toml.
#
# Fields, with defaults:
#   name       required: lowercase letters, digits and underscores
#   solid      true: whether bodies collide with it
#   friction   1.0: grip for a body standing on it; near 0 is ice
#   placeable  true: whether players can place it
#   textures   a name from textures/ for every face, or { top, bottom, side }
#   color      [r, g, b] sRGB, for blocks without textures. Optional with textures:
#              it defaults to the side texture's average color.
#   shape      a name from [shapes], or a list of boxes; default a full block
#   turning    which turns it takes when placed. Every block is placed the same way: its
#              bottom against the face you aim at, its north side the way you look.
#              "none": never turned (default)
#              "axis": only which way its up axis points (logs)
#              "any": the whole turn (slabs, stairs)
#   turn_textures  false: textures stay lined up with the world, so bricks run level however
#                  the block is turned (default). true: they turn with it, like bark.
#   material   what breaking it drops: its volume of this material, so a slab drops half.
#              Defaults to the block's own name; blocks of one material share it.
#
# Shapes are boxes in sixteenths of a boxel: [x0, y0, z0, x1, y1, z1], each from 0 to 16,
# as the block stands unturned (+Z up, +Y north). Textures crop to the part each box covers.

[shapes]
slab = [[0, 0, 0, 16, 16, 8]]
# The high step is on the north side.
stairs = [[0, 0, 0, 16, 16, 8], [0, 8, 8, 16, 16, 16]]
post = [[6, 6, 0, 10, 10, 16]]

[[block]]
name = "stone"
textures = "stone"

[[block]]
name = "dirt"
textures = "dirt"

[[block]]
name = "grass"
textures = { top = "grass", bottom = "dirt", side = "grass_side" }
material = "dirt"

[[block]]
name = "brick"
textures = "brick"

# A debug landmark, so it stays a flat, loud color.
[[block]]
name = "marker"
color = [240, 180, 40]

[[block]]
name = "ice"
textures = "ice"
friction = 0.1

[[block]]
name = "stone_slab"
textures = "stone"
shape = "slab"
turning = "any"
material = "stone"

[[block]]
name = "stone_stairs"
textures = "stone"
shape = "stairs"
turning = "any"
material = "stone"

[[block]]
name = "brick_slab"
textures = "brick"
shape = "slab"
turning = "any"
material = "brick"

[[block]]
name = "brick_stairs"
textures = "brick"
shape = "stairs"
turning = "any"
material = "brick"

# A bare post for now; fences joining their neighbors come later. It can lie on its side as a
# beam, with the grain along it.
[[block]]
name = "wood_fence"
textures = "wood"
shape = "post"
turning = "axis"
turn_textures = true
material = "wood"

[[block]]
name = "log"
textures = { top = "log_top", bottom = "log_top", side = "log" }
turning = "axis"
turn_textures = true
