# The base game's blocks and how they look. Each gets the `base:` namespace from mod.toml.
#
# Block fields, with defaults:
#   name       required: lowercase letters, digits and underscores
#   solid      true: whether bodies collide with it
#   friction   1.0: grip for a body standing on it; near 0 is ice
#   placeable  true: whether players can place it
#   look       a name from [looks]: how it looks, inside and out
#   color      [r, g, b] sRGB, for blocks without a look. Optional with a look: it defaults
#              to the look's average color.
#   shape      a name from the shapes table, or a list of boxes; default a full block
#   turning    which turns it takes when placed. Every block is placed the same way: its
#              bottom against the face you aim at, its north side the way you look.
#              "none": never turned (default)
#              "axis": only which way its up axis points (logs)
#              "any": the whole turn (slabs, stairs)
#   material   what breaking it drops: its volume of this material, so a slab drops half.
#              Defaults to the block's own name; blocks of one material share it.
#   properties what a material does wherever a piece of it is, in any shape made of it; none
#              by default.
#              "trigger": interact (E) on it signals its boxel
#              "conductor": a signal reaching a boxel with a piece of it goes on into every
#                           face-touching boxel with a piece of it, like a wire
#              "phase": a signal flips the piece's group (touching pieces of the material)
#                       between shown and hidden, taking what's within a texel along
#              "starts_hidden": placed hidden, as if just signaled to hide
#              "fuse": touching a lens piece face to face sets both off
#              "lens": when a fuse piece touches it, both are used up and a blast fires from
#                      the fuse through the lens (see SignalDef's blast in the base mod).
#                      A blast reaching a lens sets it off too, firing on the same way.
#              "storage": a loose item touching it goes into its boxel, as the materials it's
#                         made of; breaking the boxel's last storage piece drops it all
#              "mender": remembers the texels within its reach (a texel by default); a signal
#                        puts back the ones that are gone, paid for from the storage the
#                        same signal reached, all or nothing
#
# Every block here is a full block: shapes aren't listed, they're crafted. A crafting table
# (see crafting.toml) turns a pattern of a material into a part of any shape, and the test
# area's stairs, slabs and posts are built the same way. The shape and turning fields are
# still there for mods that want a fixed shape. Every material's block is placeable; grass
# breaks into dirt, and the marker is only for the test area.
#
# Shapes are boxes in sixteenths of a boxel: [x0, y0, z0, x1, y1, z1], each from 0 to 16,
# as the block stands unturned (+Z up, +Y north). A [shapes] table can name shapes for blocks
# to share.
#
# Looks are solid: a cube of 16×16×16 texels that fills the boxel and repeats every block.
# Every face shows the texels just inside it, so a slab or stair shows the part of the cube
# it cuts through. A shape's boxes are in sixteenths, so their edges fall between texels.
# A look stays lined up with the world however its blocks are turned, so bricks and planks
# run level, unless it has turns = true: then it turns with them, like a log's rings.
# Each look has one base pattern, and may add a top cover. Colors are [r, g, b] sRGB; seed
# (default 0) picks a different but repeatable variation.
#   noise   speckle: { colors, scale, seed }. scale is texels across a blob, 1 to 16: one
#           number, or [x, y, z] to stretch it (default 1).
#   bricks  { pattern, length, height, colors, mortar, offset, speckle, seed }: rows of bricks, each row
#           shifted half a brick. length and height are in texels, mortar included, and must
#           divide 16. Without mortar, bricks are told apart by color alone. Bricks that touch
#           never share a color, which takes at least 4 colors (1 is allowed: all alike).
#           pattern = "herringbone" lays bricks length by half that, zigzagging along X and
#           Y in each course, each course shifted along X; length must be 2, 4 or 8, and
#           there's no mortar. pattern = "weave" cuts the block into cubes length across,
#           each holding four bricks (length by half by half) that all run one way: upright
#           cubes checkered with cubes along X in the bottom half and along Y in the top, so
#           every face shows all three. length must be 2, 4 or 8, height half of it, no mortar.
#           pattern = "staggered" is the weave with its two layers of cubes in a running bond,
#           the top one shifted half a cube along X and Y, and (by default offset) the whole
#           pattern shifted a quarter cube so the block's edges cut through bricks. One layer
#           checkers cubes along X and Y, the other upright cubes and cubes along X. offset ([x, y, z]
#           texels) shifts the pattern; by default the mortar keeps off the layers faces show.
#           speckle is how much each texel's shade varies, 0 to 0.5 either way (default 0.08).
#   planks  { width, thickness, colors, seam, shade, cross, seed }: boards along X, width
#           texels across and thickness (default width) up, seam included, with a joint along
#           each, kept off the layers faces show. Both must divide 16. Without seam, boards are
#           told apart by shade: each board is one of four steps from shade darker to shade
#           lighter (0 to 0.5, default 0), and boards that touch never share a step. cross = true turns each layer of boards a quarter turn from the one
#           below, along X then Y, a whole block long with no joints.
#   rings   { colors, spacing, bark, bark_depth, seed }: rings around the up axis, one color
#           per ring repeating outward, inside a shell of bark (bark_depth texels, default 1).
#   top     { colors, depth, ragged, scale, seed }: a cover over the top, depth texels deep
#           and up to ragged texels deeper in places, like grass on dirt.
# A look may also have a sheen ({ strength, sharpness }: a highlight from the sun, like ice) and
# a glow (0 to 4): it lights itself, ignoring the sun and shade, at its own colors times this.
# A glow lights nothing around it.

[looks.stone]
noise = { colors = [[104, 104, 104], [117, 117, 117], [128, 128, 128], [141, 141, 141]], scale = 2, seed = 1 }

[looks.dirt]
noise = { colors = [[98, 67, 44], [112, 78, 52], [126, 89, 60], [139, 100, 68]], scale = 1.5, seed = 2 }

# Grass is a full block only for now: what a cut through it should show is in the backlog.
[looks.grass]
noise = { colors = [[98, 67, 44], [112, 78, 52], [126, 89, 60], [139, 100, 68]], scale = 1.5, seed = 2 }
top = { colors = [[76, 124, 44], [88, 140, 50], [101, 156, 58]], depth = 2, ragged = 2, scale = 2, seed = 3 }

[looks.brick]
bricks = { pattern = "staggered", length = 8, height = 4, colors = [[150, 66, 52], [188, 94, 72], [112, 46, 36], [158, 104, 80]], speckle = 0.06, seed = 4 }

[looks.ice]
sheen = { strength = 0.6, sharpness = 48 }
