noise = { colors = [[204, 112, 128], [214, 124, 140], [224, 138, 152]], scale = 4, seed = 21 }

# Dark boards under a light top, so the table reads as a work surface.
[looks.crafting_table]
planks = { width = 4, colors = [[114, 80, 47], [118, 83, 49], [122, 86, 51], [126, 88, 53]], thickness = 2, shade = 0.07, cross = true, seed = 9, grain = { scale = [12, 1, 1], strength = 0.1, seed = 19 } }
top = { colors = [[200, 166, 117], [196, 162, 113]], depth = 2, ragged = 0, scale = 2, seed = 10 }

[[block]]
name = "stone"
sounds = { step = "step_on_stone", broken = "break_stone", placed = "place" }
look = "stone"

[[block]]
name = "dirt"
sounds = { step = "step_on_dirt", broken = "break_soft", placed = "place" }
look = "dirt"

[[block]]
name = "grass"
sounds = { step = "step_on_grass", broken = "break_soft", placed = "place" }
placeable = false
look = "grass"
material = "dirt"

[[block]]
name = "brick"
sounds = { step = "step_concrete", broken = "break_stone", placed = "place" }
look = "brick"

# A debug landmark, so it stays a flat, loud color.
[[block]]
name = "marker"
sounds = { step = "step_on_marker", broken = "break_stone", placed = "place" }
placeable = false
color = [240, 180, 40]

[[block]]
name = "ice"
sounds = { step = "step_on_ice", broken = "break_ice", placed = "place_ice" }
look = "ice"
friction = 0.1

[[block]]
name = "wood"
sounds = { step = "step_on_wood", broken = "break_wood", placed = "place_wood" }
look = "wood"

[[block]]
name = "log"
sounds = { step = "step_on_log", broken = "break_wood", placed = "place_wood" }
look = "log"
turning = "axis"

[[block]]
name = "gravel"
sounds = { step = "step_on_gravel", broken = "break_soft", placed = "place" }
look = "gravel"

# Where shapes are crafted (see crafting.toml). It turns like stairs: placed, its front faces
# you, and each face of it makes shapes a different way.
[[block]]
name = "crafting_table"
sounds = { step = "step_on_crafting_table", broken = "break_wood", placed = "place_wood" }
look = "crafting_table"
turning = "any"

# Materials with properties: what crafted shapes made with them do. Brass is a trigger (a knob,
# a lever); copper carries a signal on, like a wire. Phasite and antiphasite are make-believe:
# a signal flips them between shown and hidden, taking what touches them along; antiphasite
# starts hidden. A Minecraft door is a phasite panel and an antiphasite panel swung open.
[[block]]
name = "brass"
sounds = { step = "step_concrete", broken = "break_stone", placed = "place" }
look = "brass"
properties = ["trigger"]

[[block]]
name = "iron"
sounds = { step = "step_concrete", broken = "break_stone", placed = "place" }
look = "iron"

[[block]]
name = "copper"
sounds = { step = "step_concrete", broken = "break_stone", placed = "place" }
look = "copper"
properties = ["conductor"]

[[block]]
name = "phasite"
sounds = { step = "step_concrete", broken = "break_stone", placed = "place" }
look = "phasite"
properties = ["phase"]

[[block]]
name = "antiphasite"
sounds = { step = "step_concrete", broken = "break_stone", placed = "place" }
look = "antiphasite"
properties = ["phase", "starts_hidden"]

# Make-believe, for trying out what materials could do (2026-11-08; names are placeholders).
# Lumite glows. A blue crystal touching a green one sets both off: a blast fires from the blue
# through the green. A green crystal's breaking sound is its blast.
[[block]]
name = "lumite"
sounds = { step = "step_concrete", broken = "break_ice", placed = "place_ice" }
look = "lumite"
light = [255, 200, 130]

[[block]]
name = "blue_crystal"
sounds = { step = "step_concrete", broken = "break_ice", placed = "place_ice" }
look = "blue_crystal"
light = [40, 60, 120]
properties = ["fuse"]

[[block]]
name = "green_crystal"
sounds = { step = "step_concrete", broken = "blast_laser", placed = "place_ice" }
look = "green_crystal"
properties = ["lens"]

# Make-believe (2026-11-11): storage and a mender. A bin of cachite catches loose items; a signal
# reaching mendite puts back what's gone around it, paid for from the cachite it reached.
[[block]]
name = "cachite"
sounds = { step = "step_concrete", broken = "break_stone", placed = "place" }
look = "cachite"
properties = ["storage"]

[[block]]
name = "mendite"
sounds = { step = "step_concrete", broken = "break_ice", placed = "place_ice" }
look = "mendite"
properties = ["mender"]
