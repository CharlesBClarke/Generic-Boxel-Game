# What the player carries: an amount of each material and part. Placing a block uses up its
# volume of its material, or one part; breaking one drops it back. Amounts are in boxels' worth:
# a slab is 0.5.
#
#   capacity      how much fits, every material together; leave it out for no limit
#   throw_speed   meters per second a thrown item leaves at, along the look
#   pickup_delay  seconds before a thrown item can be picked up again
#   endless       materials that never run out: always at least 64, shown as ∞
#   [start]       what the player starts with, by material

# No capacity: the player carries without limit (2026-11-02, at the user's request; see
# "Rethink the inventory" in SLICES.md).
throw_speed = 6
pickup_delay = 1.5
# The world can't give these back, so they never run out (2026-11-07, at the user's request).
# Iron is left out: it does nothing yet. The experimental materials (2026-11-08) too.
endless = ["brass", "copper", "phasite", "antiphasite", "lumite", "blue_crystal", "green_crystal"]

# The test area has brick to break but no wood, so start with some of both.
[start]
brick = 16
wood = 16
# For doors, levers and wires (see blocks.toml).
brass = 4
iron = 4
copper = 4
phasite = 4
antiphasite = 4
