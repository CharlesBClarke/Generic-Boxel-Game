[workspace]
resolver = "3"
members = [
    "crates/api",
    "crates/sim",
    "crates/protocol",
    "crates/server",
    "crates/client",
    "crates/base",
    "crates/base_movement",
    "crates/base_cow",
    "crates/wasm_host",
    "crates/data_mods",
    "crates/game",
    "crates/test_mods/panicky_movement",
    "crates/test_mods/hostile_movement",
    "crates/test_mods/stuck_movement",
    "crates/test_mods/hostile_brain",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
api = { path = "crates/api" }
sim = { path = "crates/sim" }
protocol = { path = "crates/protocol" }
server = { path = "crates/server" }
client = { path = "crates/client" }
base = { path = "crates/base" }
base_movement = { path = "crates/base_movement" }
base_cow = { path = "crates/base_cow" }
wasm_host = { path = "crates/wasm_host" }
data_mods = { path = "crates/data_mods" }
# Pinned to the glam version Bevy 0.18 uses, so math types cross the render boundary without conversion.
glam = "0.30.7"
# Bevy's defaults (the 2d, 3d and ui sets) without its audio: sound goes through kira instead.
bevy = { version = "0.18.1", default-features = false, features = [
    "default_app", "default_platform", "2d_bevy_render", "3d_bevy_render", "ui", "scene", "picking",
] }
bevy_egui = "0.39.1"
# Sound: a mixer with tracks, spatial sound and effects, so muffling and reverb can come later.
# 0.10 for now: later versions use a newer cpal than Bevy 0.18's, and only one may link ALSA.
kira = { version = "0.10.8", default-features = false, features = ["cpal", "ogg", "wav"] }
# Trig that gives the same bits natively and in WebAssembly.
libm = "0.2.16"
# zstd in plain Rust, for stored chunks: the format the design doc names for disk and network.
ruzstd = "0.8.3"
# Data mods: TOML definitions and PNG textures.
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
# Data mods: model textures.
png = "0.18.1"
# Data mods: animated models.
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names"] }
wit-bindgen = "0.63.0"
wit-component = "0.262.0"
wasmtime = { version = "50.0.0", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "parallel-compilation"] }

# Bevy is slow unoptimized; optimize dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
